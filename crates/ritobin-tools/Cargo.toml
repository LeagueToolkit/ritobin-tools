[package]
name = "ritobin-tools"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
miette = { version = "7.6.0", features = ["fancy"] }

tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["local-time"] }
tracing-indicatif = "0.3"
indicatif = "0.18"

color-eyre = "0.6"
colored = "3"

fancy-regex = "0.18"

itertools = "0.15"
time = "0.3.37"
camino = { version = "1.1", features = ["serde1", "proptest1"] }
parking_lot = "0.12.3"


directories-next = "2.0"
dirs-next = "2.0"
walkdir = "2.4.0"

clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
csv = "1.3.1"

convert_case = "0.11"
similar = "3"
ureq = "3"

ltk_ritobin = { version = "0.4" }
ltk_meta = { version = "0.6" }
ltk_hash = { version = "0.3" }
