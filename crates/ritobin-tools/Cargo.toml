[package]
name = "ritobin-tools"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Convert, diff and patch League of Legends bin files"
repository = "https://github.com/LeagueToolkit/ritobin-tools"

[dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["local-time"] }
indicatif = "0.18"

colored = "3"

camino = { version = "1.1", features = ["serde1"] }
directories = "5"
indexmap = "2"
walkdir = "2.4.0"

clap = { version = "4", features = ["derive"] }
clap_complete = "4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
csv = "1.3.1"

similar = "3"
regex = "1"

ltk_ritobin = { version = "0.9", features = ["serde"] }
ltk_meta = { version = "0.8.6", features = ["serde"] }
ltk_hash = "0.4"

ltk_mimir_cache = { version = "0.1", features = ["ureq"] }

ltk_game_data = "0.8"
ltk_game_index = { version = "0.1.4", features = ["objects"] }
ltk_wad = "0.5.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ltk_modpkg = "0.12"
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
